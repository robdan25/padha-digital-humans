name: Slither Static Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  slither:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          python -m pip install "slither-analyzer>=0.10.0" "crytic-compile>=0.3.0"
          slither --version

      # Foundry setup (if foundry.toml exists)
      - name: Install Foundry
        if: hashFiles('foundry.toml') != ''
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Foundry version
        if: hashFiles('foundry.toml') != ''
        run: |
          forge --version
          cast --version

      - name: Install Foundry dependencies
        if: hashFiles('foundry.toml') != ''
        run: forge install --no-commit

      # Hardhat/Node setup (if package.json exists)
      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      # Run Slither analysis
      - name: Run Slither
        run: |
          slither . \
            --filter-paths "node_modules|lib|out|artifacts|cache|test|script" \
            --exclude-dependencies \
            --exclude-informational \
            --exclude-optimization \
            --fail-medium \
            --json slither-report.json \
            --checklist \
            --markdown-root .
        continue-on-error: true

      # Upload results
      - name: Upload Slither results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: slither-report.json

      # Generate GitHub Security Advisory (optional)
      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
        continue-on-error: true
