name: Slither Static Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  slither:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer

      # Optional but recommended: solc-select lets Slither match compiler versions.
      - name: Install solc-select
        run: |
          pip install solc-select
          solc-select install 0.8.27 || true
          solc-select use 0.8.27 || true

      - name: Run Slither (SARIF)
        run: |
          make slither-sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: slither-report.sarif
